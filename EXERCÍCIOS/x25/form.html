<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
           <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" minlength="3" size="30" placeholder="Digite seu nome"> 
        </p>
        <p>    
            <label for="imidia">Média:</label>
            <input type="number" name="media" id="imidia" required min="0" max="10" step="0.1" placeholder="0 a 10" value="0">
        </p>
        <p>    
            <label for="imes">Período lectivo:</label> 
            <input type="month" name="mes" id="imes" required min="0" max="10" step="0.1" placeholder="Digite o período lectivo" value="2026-09">
        </p>
        <p>    
            <label for="idia">Dia da prova:</label> 
            <input type="date" name="dia" id="idia" required min="0" max="31" step="1" value="2026-09-22" placeholder="Digite o dia da prova">
        </p>
        <p>    
            <label for="ihora">Hora da prova:</label>    
            <input type="time" name="hora" id="ihora" required min="0" max="23" step="1" placeholder="Digite a hora da prova">
        </p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">


    </form>
</body>
</html>

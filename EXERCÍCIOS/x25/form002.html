<!DOCTYPE html>
<html lang=" pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>  Tst formulário  </h1>

    <form action="cadastro.php" method="post" autocomplete="on">

        <p><label for="lusuario">Usuário:</label>
             <input type="text" name="usuario" id="lusuario" required maxlength="10" minlength="3" size="10" placeholder="Digite seu usuário">
            </p>

        <p><label for="lsenha">Senha:</label>
             <input type="password" name="senha" id="lsenha" required maxlength="15" minlength="8" size="10" placeholder="Digite sua senha">
            </p>

        <p><input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

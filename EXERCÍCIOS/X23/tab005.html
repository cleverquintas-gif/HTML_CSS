<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Completa</title>
<style>  
    body{
        font-family: Arial, Helvetica, sans-serif;
    }
    table{
        width: 500px;
    }
    caption{
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.80em;
        background-color: grey;
        color: white;
    }
    td,th{
        border: 1px solid black;
        text-align: center;
    }

    .coluna1{
        background-color: lightblue;
    }
    .coluna23{
        background-color: lightgreen;
    }
   
    .coluna4 {
        background-color: lightcoral;
    }

  
</style>
</head>
<body>
    <h1>Exercício de colgroup</h1>
    <table>
        <col class="coluna1">
        <col class="coluna23" colspan="2"> 
        <col class="coluna4">
        <caption> Cadastro de Clientes    </caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Idade</th>
            <th scope="col">Cidade</th>
            <th scope="col">Produto</th>
        </tr>
        <tr>
            <td>João</td>
            <td>25</td>
            <td>São Paulo</td>
            <td>Produto A</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>30</td>
            <td>Rio de Janeiro</td> 
            <td>Produto B</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>28</td>
            <td>Belo Horizonte</td>
            <td>Produto C</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>22</td>
            <td>Curitiba</td>
            <td>Produto D</td>
        </tr>
    </table>
</body>
</html>

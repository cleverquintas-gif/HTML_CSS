<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Completa</title>
<style>  
    body{
        font-family: Arial, Helvetica, sans-serif;
        background-image: url(wallpaper004.jpg);
        background-attachment: fixed;
        background-size: cover;
    }
    table{
        width: 500px;
    }
    caption{
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.80em;
        background-color: grey;
    }
    td,th{
        border: 1px solid black;
        text-align: center;
    }
    thead{
        background-color: gray;
        color: white;
    }
    tbody tr:nth-child(2n){

        background-color: black;
        color: white;
    }
  
</style>
</head>
<body>
        <table> 
        <caption>    Filmes favoritos    </caption>

        <thead> 
        <th scope="col"> Grupo   </th>
        <th scope="col"> Nomes   </th>
        <th colspan="3" scope="col" >  Filmes  </th>
        </thead>

        <tfoot>
        <th scope="row">Total</th>
        <td> 600 </td>
         </tfoot>

        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup"> Mulheres </th>
                <td> Ana </td>
                <td> Alien </td>
                <td> Rambo </td>
                <td> Vingadores </td>
            </tr>
            <tr>
                
                <td> Beatriz </td>
                <td> Hulk </td>
                <td> Incendio </td>
                <td> Guardians </td>
            </tr><tr>
                
                <td> Carolina </td>
                <td> Star Wars </td>
                <td>Zomb  </td>
                <td> Vingadores </td>
            </tr>
             <tr>
                <th rowspan="3" scope="rowgroup"> Homens </th>
                <td> Martins </td>
                <td> Alien </td>
                <td> Rambo </td>
                <td> Vingadores </td>
            </tr>
            <tr>
                
                <td> Leandro </td>
                <td> Hulk </td>
                <td> Incendio </td>
                <td> Guardians </td>
            </tr><tr>
                
                <td> Milchael</td>
                <td> Star Wars </td>
                <td>Zomb  </td>
                <td> Vingadores </td>
            </tr>
        </tbody>
        </table>
</body>
</html>
